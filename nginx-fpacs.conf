server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas no existentes caen a index.html. Nunca cachear HTML.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Cache agresivo SOLO en archivos con hash en el nombre (immutable).
    # Matchea: app.bundle.HASH.css/js, 1266.HASH.css/js, HASH.wasm, fonts, imgs.
    location ~* \.[a-f0-9]+\.(js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # app-config.js se reemplaza al deploy, no cachear
    location = /app-config.js {
        add_header Cache-Control "no-store";
    }

    # index.html: no cachear
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }
}
